name: CI

on:
  push:
  pull_request:

jobs:
  abaplint-transpiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-fund --no-audit
      - name: abaplint
        run: npm run lint
      - name: ABAP Unit on the abaplint transpiler
        run: npm run unit
