name: CI

on:
  push:
  pull_request:

jobs:
  abaplint-transpiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-fund --no-audit
      - name: Cache the abaplint build
        uses: actions/cache@v4
        with:
          path: tools/abaplint
          key: abaplint-${{ hashFiles('tools/toolchains.lock.json') }}
      - name: abaplint
        run: npm run lint
      - name: Cache the transpiler build
        uses: actions/cache@v4
        with:
          path: tools/transpiler
          key: transpiler-${{ hashFiles('tools/toolchains.lock.json') }}
      - name: ABAP Unit on the abaplint transpiler
        run: npm run unit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyarrow and DuckDB
        run: pip install -r tools/golden/requirements.txt
      - name: Write the sample files on the abaplint transpiler
        run: npm run samples
      - name: Read them with pyarrow and DuckDB
        run: python tools/writer/check.py results/samples --toolchain abaplint-transpiler
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transpiler-unit
          path: |
            results/transpiler-unit.json
            results/samples/
